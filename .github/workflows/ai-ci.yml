name: AI CI

on:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Validate Compose configuration
        env:
          JWT_SECRET: ci-only-signing-secret-never-used-outside-tests
        run: docker compose --env-file /dev/null config --quiet
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Install versioned model
        run: python scripts/install_model.py
      - name: Run regression tests
        run: python -m pytest -q tests
